name: Hello

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show where we are
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit:     $GITHUB_SHA"
          echo "Branch:     $GITHUB_REF_NAME"
          ls -la

