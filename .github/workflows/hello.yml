name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the README is not empty
        run: |
          if [ ! -s README.md ]; then
            echo "::error file=README.md::README.md is empty"
            exit 1
          fi
          echo "README.md has $(wc -l < README.md) lines"

